server:
  port: 18085
  servlet:
    session:
      timeout: 30m
      cookie:
        name: B_DEMO_SESSION
        http-only: true
        same-site: lax
        secure: false

sso:
  # 1. 对应主平台 SSO 服务的基础地址
  base-url: http://localhost:19089/oauth2Server/oauth2
  # 2. 匹配数据库 sys_sso 录入的 client_id 和明文密钥 (正确无误)
  client-id: demo_client_b
  client-secret: "DemoSecret2026!BatchTestKey888"
  # 3. 固定回调地址 (与数据库中的 sys_address + callback_address 完全一致)
  callback-url: http://localhost:18080/api/auth/callback
  # 4. 认证模式 (正确无误)
  auth-mode: PAGE_CONTROLLED
  connect-timeout: 2s
  read-timeout: 3s
