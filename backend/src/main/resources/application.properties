# DCS4 SSO V2 Client Demo 后端属性配置
# 优先通过根目录的 .env 文件注入敏感密钥 SSO_CLIENT_SECRET
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=18085
server.servlet.session.cookie.name=B_DEMO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# 1. 对应主平台 SSO 服务的基础地址
sso.base-url=${SSO_BASE_URL:http://localhost:19089/oauth2Server/oauth2}

# 2. 匹配数据库 sys_sso 录入的 client_id 和明文密钥 (由根目录 .env 注入)
sso.client-id=${SSO_CLIENT_ID:demo_client_b}
sso.client-secret=${SSO_CLIENT_SECRET:}

# 3. 固定回调地址 (与数据库中的 sys_address + callback_address 完全一致)
sso.callback-url=${B_CALLBACK_URL:http://localhost:18085/api/auth/callback}

# 4. 认证模式 (支持在 .env 中设置 SSO_AUTH_MODE 覆盖，默认 SSO_ONLY)
sso.auth-mode=${SSO_AUTH_MODE:SSO_ONLY}
sso.connect-timeout=2s
sso.read-timeout=3s