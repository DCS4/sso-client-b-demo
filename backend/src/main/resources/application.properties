server.port=18085
server.servlet.session.cookie.name=B_DEMO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# 1. 对应主平台 SSO 服务的基础地址
sso.base-url=http://localhost:19089/oauth2Server/oauth2

# 2. 匹配数据库 sys_sso 录入的 client_id 和明文密钥 (正确无误)
sso.client-id=demo_client_b
sso.client-secret=DemoSecret2026!BatchTestKey888

# 3. 固定回调地址 (与数据库中的 sys_address + callback_address 完全一致)
sso.callback-url=http://localhost:18080/api/auth/callback

# 4. 认证模式 (正确无误)
sso.auth-mode=PAGE_CONTROLLED
sso.connect-timeout=2s
sso.read-timeout=3s