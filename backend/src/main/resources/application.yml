# 唯一的默认配置。复制根目录 .env.example 为 .env，填写当前环境的值。
# .env 按 Java properties 格式读取：KEY=value，不写 export，不给值额外加引号。
spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

server:
  port: ${SERVER_PORT:18085}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: B_DEMO_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

sso:
  # 远端 SSO V2 接口前缀；不是 Portal 的网页地址。
  base-url: ${SSO_BASE_URL:http://localhost:19089/oauth2Server/oauth2}
  client-id: ${SSO_CLIENT_ID:demo_client_b}
  client-secret: ${SSO_CLIENT_SECRET:}
  # 单 JAR 示例用 18085；Vite 双进程开发时改为 5173，并同步 SSO 登记。
  callback-url: ${B_CALLBACK_URL:http://localhost:18085/api/auth/callback}
  # 与 SSO 管理端保持一致：PAGE_CONTROLLED 或 SSO_ONLY。
  auth-mode: ${SSO_AUTH_MODE:SSO_ONLY}
  connect-timeout: ${SSO_CONNECT_TIMEOUT:2s}
  read-timeout: ${SSO_READ_TIMEOUT:3s}
