server.port=18080
server.servlet.session.cookie.name=B_DEMO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.datasource.url=jdbc:h2:mem:demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
sso.base-url=${SSO_BASE_URL:http://localhost:10089/sso/v1}
sso.issuer=${SSO_ISSUER:jeecg-sso}
sso.client-id=${SSO_CLIENT_ID:demo-client-b}
sso.client-secret=${SSO_CLIENT_SECRET:}
sso.callback-url=${B_CALLBACK_URL:http://localhost:18080/api/auth/callback}
sso.return-url=${B_RETURN_URL:http://localhost:18080/}
sso.trusted-jwks=${SSO_TRUSTED_JWKS:}
