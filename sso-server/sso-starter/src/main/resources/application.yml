# SSO 启动模块的默认运行配置；密钥必须以环境变量或受控配置注入，禁止提交真实值。
server:
  address: 127.0.0.1
  port: 19089

sso:
  public-base-url: http://192.9.230.21:10089
  portal-login-url: http://192.9.230.21:10088/login
  portal-post-logout-url: http://192.9.230.21:10088/login
  issuer: http://192.9.230.21:10089
  inner-token: ${SSO_INNER_TOKEN:}
  master-key-env: SSO_MASTER_KEY
  key-store-path: /opt/jeecg-sso/keys
  current-kid: "2026-01"
  # 除当前 kid 外，只有这里明确列出且未到截止时间的公钥才发布到 JWKS。
  # 示例："2026-01": "2026-06-30T00:00:00Z"，过期后自动不再发布；JWK 文件由运维清理。
  jwks-additional-kids: {}
  session-absolute-timeout: 4h
  session-idle-timeout: 30m
  code-ttl: 90s
  pending-ttl: 10m
  pending-max-retry: 3
  assertion-ttl: 60s
  logout-request-ttl: 30s
  logout-token-ttl: 10m
  revocation-tombstone-ttl: 24h
  revocation-recovery-fixed-delay-ms: 10000
  nonce-ttl: 5m
  timestamp-window: 120s
  # 非 RFC1918 企业网段必须显式列出；未配置时禁止回调，避免数据库登记项成为 SSRF 出口。
  backchannel-allowed-cidrs:
    - 192.9.230.0/24

# /internal/** 仅绑定回环。Nginx 只代理 /sso/v1/**，不得代理此路径。
