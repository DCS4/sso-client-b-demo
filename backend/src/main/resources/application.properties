server.port=18080
server.servlet.session.cookie.name=B_DEMO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
sso.base-url=${SSO_BASE_URL:http://localhost:10089/oauth2Server/oauth2}
sso.client-id=${SSO_CLIENT_ID:}
sso.client-secret=${SSO_CLIENT_SECRET:}
sso.callback-url=${B_CALLBACK_URL:http://localhost:18080/api/auth/callback}
sso.auth-mode=${SSO_AUTH_MODE:PAGE_CONTROLLED}
sso.connect-timeout=${SSO_CONNECT_TIMEOUT:2s}
sso.read-timeout=${SSO_READ_TIMEOUT:3s}
